<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="620"
  viewBox="0 0 1200 620"
  data-layout-contract-ref="board.ximitu-card-hunt.zone-01-layout.v2"
  role="img"
  aria-labelledby="guide-title guide-description"
>
  <title id="guide-title">云港区 Image Gen 美术布局引导图</title>
  <desc id="guide-description">
    Zone-01 启航海湾的生产用布局引导图。画布坐标与棋盘的 0,0 到 1200,620
    完全一致，标出路线安全走廊、条件云阶、大炮捕获路径、五项港口设施锚点、禁放高物区域及区域接缝带。
  </desc>

  <defs>
    <pattern id="minor-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#bdd5e5" stroke-width="1" opacity="0.45" />
    </pattern>
    <pattern id="major-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#minor-grid)" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#7fa4bd" stroke-width="1.5" opacity="0.65" />
    </pattern>
    <pattern id="no-tall-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#ff5a6f" opacity="0.1" />
      <rect width="5" height="14" fill="#ff3557" opacity="0.24" />
    </pattern>
    <pattern id="transition-hatch" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 0 18 L 18 0 M -9 9 L 9 -9 M 9 27 L 27 9" stroke="#7549d8" stroke-width="4" opacity="0.2" />
    </pattern>
    <marker id="flight-arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#087f9a" />
    </marker>
    <filter id="label-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Exact production canvas: zone-01 bounds x=0, y=0, width=1200, height=620. -->
  <rect width="1200" height="620" fill="#effaff" />
  <rect width="1200" height="620" fill="url(#major-grid)" />

  <!-- Transition bands are kept low-detail so SVG masks can hide neighboring image seams. -->
  <g id="transition-bands">
    <rect x="1120" y="0" width="80" height="620" fill="url(#transition-hatch)" />
    <rect x="0" y="560" width="1200" height="60" fill="url(#transition-hatch)" />
    <text x="1160" y="372" fill="#5c37b8" font-family="Arial, sans-serif" font-size="14" font-weight="700"
      text-anchor="middle" transform="rotate(-90 1160 372)">RIGHT SEAM · LOW DETAIL</text>
    <text x="850" y="603" fill="#5c37b8" font-family="Arial, sans-serif" font-size="14" font-weight="700"
      text-anchor="middle">ZONE-04 OVERLAP · y 560–620 · TEXTURE ONLY</text>
  </g>

  <!--
    Route-safe corridor: 180 px stroke = roughly 90 px clearance on either side
    of every navigable edge. Image Gen should use ground, water, mist, grass or
    other low-profile scenery here, never buildings or tall foreground objects.
  -->
  <g id="route-safe-corridor" fill="none" stroke="#ffd05a" stroke-width="180" stroke-linecap="round" stroke-linejoin="round" opacity="0.48">
    <path d="M 80 520 L 160 525 L 240 490 L 315 435" />
    <path d="M 315 435 L 380 350 L 465 300 L 550 335 L 635 410" />
    <path d="M 315 435 L 375 505 L 465 540 L 555 500 L 635 410" />
    <path d="M 635 410 L 705 345 L 770 280" />
    <path d="M 770 280 L 835 205 L 920 165 L 1000 210 L 1070 285" />
    <path d="M 770 280 L 845 340 L 930 390 L 1010 350 L 1070 285" />
    <path d="M 1070 285 L 1120 225 L 1140 165 L 1080 115 L 1135 65 L 1200 81" />
    <path d="M 1070 285 C 1125 250 1122 214 1091 191 C 1059 168 1058 137 1080 115" />
  </g>

  <!-- Explicit no-tall-object clearance around functional and landmark anchors. -->
  <g id="no-tall-object-zones" fill="url(#no-tall-hatch)" stroke="#eb3152" stroke-width="3" stroke-dasharray="10 7">
    <circle cx="160" cy="405" r="82" />
    <circle cx="570" cy="225" r="82" />
    <circle cx="900" cy="500" r="82" />
    <circle cx="1090" cy="55" r="82" />
    <circle cx="240" cy="490" r="76" />
    <circle cx="375" cy="505" r="82" />
    <circle cx="465" cy="300" r="118" />
    <circle cx="705" cy="345" r="98" />
    <circle cx="930" cy="390" r="92" />
    <circle cx="1135" cy="65" r="82" />
  </g>

  <!-- Cannon capture path is public: it explicitly passes n08 and lands at n09. -->
  <g id="cannon-flight-clearance" fill="none">
    <path
      d="M 465 300 Q 540 250 635 390 Q 685 385 705 345"
      stroke="#3ed7ee"
      stroke-width="118"
      stroke-linecap="round"
      opacity="0.17"
    />
    <path
      d="M 465 300 Q 540 250 635 390 Q 685 385 705 345"
      stroke="#087f9a"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="13 11"
      marker-end="url(#flight-arrow)"
    />
    <text x="575" y="268" fill="#06697e" font-family="Arial, sans-serif" font-size="15" font-weight="800"
      text-anchor="middle" filter="url(#label-shadow)">CANNON PATH · PASS n08 · LAND n09</text>
  </g>

  <!-- Conditional overlay road. It is rendered by code only after cloudRouteOpen. -->
  <g id="conditional-route-centerline" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M 1070 285 C 1125 250 1122 214 1091 191 C 1059 168 1058 137 1080 115"
      stroke="#ffffff"
      stroke-width="18"
    />
    <path
      d="M 1070 285 C 1125 250 1122 214 1091 191 C 1059 168 1058 137 1080 115"
      stroke="#23bdda"
      stroke-width="7"
      stroke-dasharray="4 10"
    />
    <text x="1018" y="188" fill="#06697e" font-family="Arial, sans-serif" font-size="13" font-weight="900"
      text-anchor="middle" filter="url(#label-shadow)">e14c · CLOUD STAIR · CONDITIONAL</text>
  </g>

  <!-- Exact route centerline for alignment checking; it is not part of the generated art. -->
  <g id="route-centerline" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ffffff" stroke-width="15">
      <path d="M 80 520 L 160 525 L 240 490 L 315 435" />
      <path d="M 315 435 L 380 350 L 465 300 L 550 335 L 635 410" />
      <path d="M 315 435 L 375 505 L 465 540 L 555 500 L 635 410" />
      <path d="M 635 410 L 705 345 L 770 280" />
      <path d="M 770 280 L 835 205 L 920 165 L 1000 210 L 1070 285" />
      <path d="M 770 280 L 845 340 L 930 390 L 1010 350 L 1070 285" />
      <path d="M 1070 285 L 1120 225 L 1140 165 L 1080 115 L 1135 65 L 1200 81" />
    </g>
    <g stroke="#174b73" stroke-width="5" stroke-dasharray="10 8">
      <path d="M 80 520 L 160 525 L 240 490 L 315 435" />
      <path d="M 315 435 L 380 350 L 465 300 L 550 335 L 635 410" />
      <path d="M 315 435 L 375 505 L 465 540 L 555 500 L 635 410" />
      <path d="M 635 410 L 705 345 L 770 280" />
      <path d="M 770 280 L 835 205 L 920 165 L 1000 210 L 1070 285" />
      <path d="M 770 280 L 845 340 L 930 390 L 1010 350 L 1070 285" />
      <path d="M 1070 285 L 1120 225 L 1140 165 L 1080 115 L 1135 65 L 1200 81" />
    </g>
  </g>

  <!-- Board nodes n01–n18, taken directly from BOARD_TEMPLATE. -->
  <g id="route-nodes" font-family="Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">
    <g fill="#ffffff" stroke="#173f63" stroke-width="3">
      <circle cx="80" cy="520" r="10" />
      <circle cx="160" cy="525" r="10" />
      <circle cx="240" cy="490" r="10" />
      <circle cx="315" cy="435" r="10" />
      <circle cx="380" cy="350" r="10" />
      <circle cx="465" cy="300" r="12" fill="#ff5b3d" />
      <circle cx="550" cy="335" r="10" />
      <circle cx="375" cy="505" r="10" />
      <circle cx="465" cy="540" r="10" />
      <circle cx="555" cy="500" r="10" />
      <circle cx="635" cy="410" r="10" />
      <circle cx="705" cy="345" r="10" />
      <circle cx="770" cy="280" r="10" />
      <circle cx="835" cy="205" r="10" />
      <circle cx="920" cy="165" r="10" />
      <circle cx="1000" cy="210" r="12" fill="#40d7b1" />
      <circle cx="845" cy="340" r="10" />
      <circle cx="930" cy="390" r="10" />
      <circle cx="1010" cy="350" r="10" />
      <circle cx="1070" cy="285" r="10" />
      <circle cx="1120" cy="225" r="10" />
      <circle cx="1140" cy="165" r="10" />
      <circle cx="1080" cy="115" r="10" />
      <circle cx="1135" cy="65" r="10" />
    </g>
    <g fill="#123d61" filter="url(#label-shadow)">
      <text x="80" y="548">n01</text>
      <text x="160" y="553">n02</text>
      <text x="240" y="518">n03</text>
      <text x="315" y="463">n04</text>
      <text x="380" y="331">n05a</text>
      <text x="465" y="278">n06a</text>
      <text x="550" y="316">n07a</text>
      <text x="375" y="533">n05b</text>
      <text x="465" y="568">n06b</text>
      <text x="555" y="528">n07b</text>
      <text x="635" y="438">n08</text>
      <text x="705" y="373">n09</text>
      <text x="770" y="308">n10</text>
      <text x="835" y="186">n11a</text>
      <text x="920" y="145">n12a</text>
      <text x="1000" y="190">n13a</text>
      <text x="845" y="368">n11b</text>
      <text x="930" y="418">n12b</text>
      <text x="1010" y="378">n13b</text>
      <text x="1070" y="313">n14</text>
      <text x="1095" y="244">n15</text>
      <text x="1110" y="187">n16</text>
      <text x="1050" y="107">n17</text>
      <text x="1135" y="45">n18</text>
    </g>
  </g>

  <!-- ThemePack landmark anchors. Generated scenery may surround, but must not cover, these anchors. -->
  <g id="landmark-anchors" font-family="Arial, sans-serif" font-weight="800">
    <g fill="#6b3ed1" stroke="#ffffff" stroke-width="4">
      <path d="M 160 389 L 176 405 L 160 421 L 144 405 z" />
      <path d="M 570 209 L 586 225 L 570 241 L 554 225 z" />
      <path d="M 900 484 L 916 500 L 900 516 L 884 500 z" />
      <path d="M 1090 39 L 1106 55 L 1090 71 L 1074 55 z" />
    </g>
    <g fill="#40218e" font-size="14" filter="url(#label-shadow)">
      <text x="160" y="375" text-anchor="middle">L1 起航站 · 160,405</text>
      <text x="570" y="196" text-anchor="middle">L2 云桥 · 570,225</text>
      <text x="900" y="473" text-anchor="middle">L3 探索营地 · 900,500</text>
      <text x="1062" y="90" text-anchor="middle">L4 远航信标 · 1090,55</text>
    </g>
  </g>

  <!-- Functional anchors override environmental composition. -->
  <g id="functional-anchors" font-family="Arial, sans-serif" font-weight="900">
    <path d="M 226 490 V 455 H 247 L 264 466" fill="none" stroke="#127d67" stroke-width="5" />
    <circle cx="264" cy="475" r="10" fill="#b6f4e3" stroke="#127d67" stroke-width="4" />
    <text x="225" y="440" fill="#0e6b58" font-size="13" text-anchor="middle" filter="url(#label-shadow)">
      MOORING CRANE · n03
    </text>

    <path d="M 344 505 H 366 L 398 493 V 517 L 366 509" fill="#9feaff" stroke="#087f9a" stroke-width="3" />
    <text x="375" y="553" fill="#06697e" font-size="13" text-anchor="middle" filter="url(#label-shadow)">
      FOGHORN · n05b
    </text>

    <path d="M 443 300 L 483 282 L 493 297 L 455 317 z" fill="#ff5b3d" stroke="#8d1c16" stroke-width="3" />
    <circle cx="449" cy="317" r="10" fill="#263c54" />
    <text x="425" y="255" fill="#9b241c" font-size="15" text-anchor="middle" filter="url(#label-shadow)">
      CANNON · n06a · 465,300
    </text>

    <circle cx="705" cy="345" r="21" fill="none" stroke="#087f9a" stroke-width="5" />
    <path d="M 705 313 V 377 M 673 345 H 737" stroke="#087f9a" stroke-width="4" />
    <text x="735" y="325" fill="#06697e" font-size="15" text-anchor="middle" filter="url(#label-shadow)">
      LANDING · n09 · 705,345
    </text>

    <circle cx="930" cy="390" r="22" fill="#ffd84a" stroke="#8a5a24" stroke-width="5" />
    <path d="M 930 369 V 411 M 909 390 H 951 M 915 375 L 945 405 M 945 375 L 915 405"
      stroke="#8a5a24" stroke-width="3" />
    <text x="930" y="440" fill="#704414" font-size="13" text-anchor="middle" filter="url(#label-shadow)">
      CLOUDFALL GATE · n12b
    </text>

    <circle cx="1135" cy="65" r="16" fill="#ffe16d" stroke="#8a5a24" stroke-width="4" />
    <path d="M 1152 65 L 1190 48 L 1190 82 Z" fill="#ffe16d" fill-opacity=".45" stroke="#8a5a24" stroke-width="2" />
    <text x="1075" y="25" fill="#704414" font-size="13" text-anchor="middle" filter="url(#label-shadow)">
      DEPARTURE BEACON · e18
    </text>
  </g>

  <!-- Production legend. All words and markings are instructions, not desired generated content. -->
  <g id="legend" font-family="Arial, sans-serif">
    <rect x="22" y="20" width="360" height="160" rx="16" fill="#ffffff" fill-opacity="0.94" stroke="#173f63" stroke-width="2" />
    <text x="42" y="48" fill="#123d61" font-size="18" font-weight="900">ZONE-01 · 启航海湾 · ART GUIDE</text>
    <text x="42" y="70" fill="#55738a" font-size="12" font-weight="700">1200 × 620 · coordinates match BOARD_TEMPLATE</text>

    <path d="M 44 92 H 88" stroke="#ffd05a" stroke-width="18" stroke-linecap="round" opacity="0.75" />
    <text x="102" y="97" fill="#173f63" font-size="13" font-weight="700">路线安全走廊：仅低矮地表 / 云雾</text>

    <rect x="42" y="110" width="46" height="18" fill="url(#no-tall-hatch)" stroke="#eb3152" stroke-width="2" />
    <text x="102" y="124" fill="#173f63" font-size="13" font-weight="700">禁放高物：不得遮挡节点、地标、特效</text>

    <path d="M 43 145 H 89" stroke="#087f9a" stroke-width="4" stroke-dasharray="9 6" />
    <text x="102" y="150" fill="#173f63" font-size="13" font-weight="700">大炮飞行净空：仅天空或轻薄云层</text>

    <text x="42" y="169" fill="#b1243c" font-size="11" font-weight="900">
      DO NOT GENERATE: 棋格、路线、角色、文字、HUD
    </text>
  </g>

  <!-- Exact zone boundary is deliberately the topmost production mark. -->
  <rect
    x="2"
    y="2"
    width="1196"
    height="616"
    fill="none"
    stroke="#0d3556"
    stroke-width="4"
    stroke-dasharray="16 8"
  />
  <g fill="#0d3556" font-family="Arial, sans-serif" font-size="12" font-weight="900">
    <text x="8" y="612">0,620</text>
    <text x="1140" y="612">1200,620</text>
    <text x="1138" y="18">1200,0</text>
  </g>
</svg>
