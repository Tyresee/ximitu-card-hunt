# Owned by ximitu-card-hunt. Installed in /etc/nginx/voice-word-attack-games/.
location = /games/monopoly {
    return 302 /games/monopoly/$is_args$args;
}
location = /prototypes/universal-board {
    return 302 /games/monopoly/$is_args$args;
}
location = /prototypes/universal-board/ {
    return 302 /games/monopoly/$is_args$args;
}
location = /prototypes/universal-board/index.html {
    return 302 /games/monopoly/$is_args$args;
}
location ^~ /games/monopoly/ {
    proxy_pass http://127.0.0.1:19421;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
location ^~ /games/monopoly-runtime/ {
    proxy_pass http://127.0.0.1:19421;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
